# /etc/portage-auto-update.conf
# The script loads this as a bash file, so use normal NAME=value lines
# Delete a line and that setting goes back to its default

# MAKEOPTS for the nightly, any value make accepts -- blank uses make.conf
#NICE_MAKEOPTS="-j4 -l3"

# Services that are safe to restart if they have deleted files open (e.g. "apache2 sshd vixie-cron")
# Space separated list. Name has to be both the service and its process name in lsof
SAFE_SERVICES="sshd"

# Packages to skip, space separated list (e.g. "app-editors/nano media-gfx/blender")
EXCLUDE_LIST=""

# Number, passed to emerge --backtrack
EMERGE_BACKTRACK=100

# Seconds allowed for each repo sync
SYNC_TIMEOUT=1800

# Single directory
LOG_DIR=/var/log/portage-auto-update

# Days to keep logs, 0 for forever
LOG_KEEP_DAYS=30

# Days to keep leftover build dirs, 0 to never clean them
TMP_KEEP_DAYS=3

# Single file, stops two runs overlapping
LOCK_FILE=/run/lock/portage-auto-update.lock

# Who gets the popup, one username (not a uid) -- blank for no popup
NOTIFY_USER=""

# One of auto, yad, zenity, xmessage or notify-send -- auto tries them in that order
NOTIFY_METHOD=auto

# Set to yes to turn a step off, anything else leaves it on
SKIP_SYNC=no
SKIP_NEWS=no
SKIP_UPDATE=no
SKIP_DEPCLEAN=no
SKIP_PRESERVED_REBUILD=no
SKIP_REVDEP=no
SKIP_PERL_CLEANER=no
SKIP_ECLEAN=no
SKIP_ETC_UPDATE=no
